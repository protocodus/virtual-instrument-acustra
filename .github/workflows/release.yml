name: Release

# A v* tag builds, validates and packages every format and drafts a GitHub
# release from them. A manual run builds and validates the same packages
# without drafting a release. main-build.yml calls it for every main build.
# README.md (Release workflow) lists the secrets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      retention-days:
        description: Days to keep each platform's package artifact
        type: number
        default: 7

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # A pinned pluginval release, each archive checked against its SHA-256.
  PLUGINVAL_VERSION: v1.0.4
  PLUGINVAL_LINUX_SHA256: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
  PLUGINVAL_MACOS_SHA256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
  PLUGINVAL_WINDOWS_SHA256: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab

jobs:
  macos:
    name: Release macOS universal (VST3, AU, CLAP, Standalone)
    runs-on: macos-15
    outputs:
      signing: ${{ steps.signing.outputs.state || 'ad-hoc signed, pkg unsigned, not notarized' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Python self-tests need numpy and scipy; configure fails rather
      # than silently registering fewer tests (ACUSTRA_REQUIRE_PYTHON_TESTS).
      - name: Set up Python for the self-tests
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy and scipy
        run: python -m pip install numpy==2.5.3 scipy==1.18.1

      - name: Build universal plug-in and run tests
        env:
          BUILD_UNIVERSAL: "ON"
          PYTHON: "${{ steps.python.outputs.python-path }}"
        run: ./scripts/build-macos.sh

      # The main build commits this render as the README screenshot.
      - name: Upload the editor screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-acustra
          path: build-macos/screenshots/acustra.png
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 7 }}

      - name: Validate the AU with auval
        run: |
          set -euo pipefail
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          ditto "build-macos/Acustra_artefacts/Release/AU/Acustra.component" "$components/Acustra.component"
          # The registrar caches the component list; restarting it rescans.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -strict -v aumu Acu1 Acst

      - name: Validate the VST3 with pluginval
        working-directory: build-macos
        run: |
          set -euo pipefail
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          echo "${PLUGINVAL_MACOS_SHA256}  pluginval.zip" | shasum -a 256 -c -
          ditto -x -k pluginval.zip .
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --verbose \
            --validate "Acustra_artefacts/Release/VST3/Acustra.vst3"

      - name: Import Developer ID identities
        id: signing
        env:
          CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          APP_IDENTITY: ${{ secrets.MACOS_APP_SIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATES_P12" ]]; then
            echo "::notice::No MACOS_CERTIFICATES_P12 secret: the macOS bundles are signed ad hoc and the pkg is unsigned."
            exit 0
          fi
          if [[ -z "$APP_IDENTITY" || -z "$INSTALLER_IDENTITY" ]]; then
            echo "::error::MACOS_CERTIFICATES_P12 needs MACOS_APP_SIGN_IDENTITY and MACOS_INSTALLER_SIGN_IDENTITY."
            exit 1
          fi
          keychain="$RUNNER_TEMP/acustra-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo -n "$CERTIFICATES_P12" | base64 --decode -o "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -P "$CERTIFICATES_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          {
            echo "APP_SIGN_IDENTITY=$APP_IDENTITY"
            echo "INSTALLER_SIGN_IDENTITY=$INSTALLER_IDENTITY"
          } >> "$GITHUB_ENV"
          state="Developer ID signed, not notarized"
          if [[ -n "$NOTARY_PASSWORD" ]]; then
            xcrun notarytool store-credentials acustra-notary --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$keychain"
            echo "NOTARY_PROFILE=acustra-notary" >> "$GITHUB_ENV"
            state="Developer ID signed, pkg notarized and stapled"
          else
            echo "::notice::No MACOS_NOTARY_PASSWORD secret: the macOS package is not notarized."
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Package macOS formats
        id: package
        run: |
          set -euo pipefail
          ./scripts/sign-and-package-macos.sh
          directory="$(python3 scripts/distribution.py --build-dir build-macos --platform macOS --arch universal --formats VST3 AU CLAP Standalone)"
          if [[ -n "${NOTARY_PROFILE:-}" ]]; then
            spctl --assess -vvv --type install "$directory"/*.pkg
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "distribution=$(sed -n 's/^ACUSTRA_DISTRIBUTION_VERSION:INTERNAL=//p' build-macos/CMakeCache.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-acustra-${{ steps.package.outputs.distribution }}
          path: ${{ steps.package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 7 }}

  windows:
    name: Release Windows x64 (VST3, CLAP, Standalone)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for packaging
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # /STACK as in the CI job: the test suites expect more than Windows' 1 MB.
      - name: Configure
        run: |
          cmake -S "." -B "build-win" -A x64 "-DACUSTRA_BUILD_PLUGIN=ON" "-DACUSTRA_BUILD_CLAP=ON" "-DACUSTRA_BUILD_TOOLS=OFF" -DBUILD_TESTING=ON "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build VST3, CLAP, standalone and plug-in tests
        run: |
          cmake --build "build-win" --config Release --parallel --target "Acustra_VST3" "Acustra_CLAP" "Acustra_Standalone" "AcustraPluginProcessorTests" "AcustraPluginTempoReleaseTests"

      - name: Run plug-in wrapper tests
        run: |
          ctest --test-dir "build-win" -C Release -R '^Acustra[.](PluginProcessor|PluginTempoRelease)$' --no-tests=error --output-on-failure

      # The zip ships no VC++ redistributable (CMAKE_MSVC_RUNTIME_LIBRARY).
      - name: Check that the binaries do not import the VC++ runtime
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }
          foreach ($binary in 'build-win\Acustra_artefacts\Release\Standalone\Acustra.exe', 'build-win\Acustra_artefacts\Release\VST3\Acustra.vst3\Contents\x86_64-win\Acustra.vst3', 'build-win\Acustra_artefacts\Release\CLAP\Acustra.clap') {
            $dependents = & $dumpbin /nologo /dependents $binary
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $binary" }
            $dependents
            if ($dependents -match '(vcruntime|msvcp)[0-9]') { throw "$binary imports the VC++ runtime DLLs" }
          }

      - name: Validate the VST3 with pluginval
        working-directory: build-win
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip"
          echo "${PLUGINVAL_WINDOWS_SHA256}  pluginval.zip" | sha256sum -c -
          7z x -y pluginval.zip
          ./pluginval.exe --strictness-level 10 --verbose \
            --validate "Acustra_artefacts/Release/VST3/Acustra.vst3"

      - name: Package Windows VST3, CLAP and standalone
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package-windows.py --build-dir build-win
          directory="$(python scripts/distribution.py --build-dir build-win --platform Windows --arch x64 --formats VST3 CLAP Standalone)"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "distribution=$(sed -n 's/^ACUSTRA_DISTRIBUTION_VERSION:INTERNAL=//p' build-win/CMakeCache.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-acustra-${{ steps.package.outputs.distribution }}
          path: ${{ steps.package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 7 }}

  linux:
    name: Release Linux x64 (VST3, CLAP, Standalone)
    # Ubuntu 22.04's glibc 2.35 is the floor the binaries may ask for (checked below).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            xvfb

      # A static, hidden libstdc++ and libgcc leave glibc the only versioned
      # dependency, and the plug-in keeps its own copy rather than binding to
      # the host's.
      - name: Configure
        run: |
          cmake \
            -S "." \
            -B "build-linux" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DACUSTRA_BUILD_PLUGIN=ON" \
            "-DACUSTRA_BUILD_CLAP=ON" \
            -DACUSTRA_BUILD_TOOLS=OFF \
            -DBUILD_TESTING=ON \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc" \
            "-DCMAKE_MODULE_LINKER_FLAGS=-static-libstdc++ -static-libgcc -Wl,--exclude-libs,ALL"

      - name: Build VST3, CLAP, standalone and plug-in tests
        run: |
          cmake --build "build-linux" --parallel \
            --target "Acustra_VST3" "Acustra_CLAP" "Acustra_Standalone" \
              "AcustraPluginProcessorTests" "AcustraPluginTempoReleaseTests"

      - name: Run plug-in wrapper tests
        run: |
          ctest --test-dir "build-linux" -R "^Acustra[.](PluginProcessor|PluginTempoRelease)$" --no-tests=error --output-on-failure

      - name: Check the glibc floor
        run: |
          set -euo pipefail
          floor=2.35
          for binary in \
              "build-linux/Acustra_artefacts/Release/VST3/Acustra.vst3/Contents/x86_64-linux/Acustra.so" \
              "build-linux/Acustra_artefacts/Release/Standalone/Acustra" \
              "build-linux/Acustra_artefacts/Release/CLAP/Acustra.clap"; do
            symbols="$(objdump -T "$binary")"
            if grep -q 'GLIBCXX_\|CXXABI_' <<<"$symbols"; then
              echo "error: $binary links the shared libstdc++" >&2
              exit 1
            fi
            needed="$(grep -o 'GLIBC_[0-9][0-9.]*' <<<"$symbols" | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
            if [[ "$(printf '%s\n' "$needed" "$floor" | sort -V | tail -n 1)" != "$floor" ]]; then
              echo "error: $binary needs glibc $needed, above the $floor floor" >&2
              exit 1
            fi
            echo "$binary needs glibc $needed"
          done

      - name: Validate the VST3 with pluginval
        working-directory: build-linux
        run: |
          set -euo pipefail
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          echo "${PLUGINVAL_LINUX_SHA256}  pluginval.zip" | sha256sum -c -
          unzip -q -o pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --verbose \
            --validate "Acustra_artefacts/Release/VST3/Acustra.vst3"

      - name: Package Linux VST3, CLAP and standalone
        id: package
        run: |
          set -euo pipefail
          python3 scripts/package-linux.py --build-dir build-linux
          directory="$(python3 scripts/distribution.py --build-dir build-linux --platform Linux --arch x64 --formats VST3 CLAP Standalone)"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "distribution=$(sed -n 's/^ACUSTRA_DISTRIBUTION_VERSION:INTERNAL=//p' build-linux/CMakeCache.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-acustra-${{ steps.package.outputs.distribution }}
          path: ${{ steps.package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 7 }}

  draft-release:
    name: Draft the GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Check the packages and write SHA256SUMS
        working-directory: release
        run: |
          set -euo pipefail
          for sums in *-SHA256SUMS.txt; do
            sha256sum -c "$sums"
          done
          python3 - "$GITHUB_REF_NAME" "$GITHUB_SHA" <<'EOF'
          import json, pathlib, sys
          tag, revision = sys.argv[1:]
          records = [json.loads(path.read_text()) for path in sorted(pathlib.Path(".").glob("*.manifest.json"))]
          platforms = sorted(record["platform"] for record in records)
          if platforms != ["Linux", "Windows", "macOS"]:
              sys.exit(f"error: expected one package set per platform, found {platforms}")
          for record in records:
              if "v" + record["version"] != tag:
                  sys.exit(f"error: tag {tag} does not name the built version {record['version']}")
              if record["source_revision"] != revision or record["source_state"] != "clean":
                  sys.exit(f"error: the {record['platform']} package was not built from a clean {revision}")
          EOF
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create the draft release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SIGNING: ${{ needs.macos.outputs.signing }}
        run: |
          set -euo pipefail
          {
            echo "Drafted by the release workflow from ${GITHUB_SHA}:"
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "- macOS universal: ${MACOS_SIGNING}; tests and validators ran only the arm64 slice."
            echo "- Windows x64: not Authenticode-signed."
            echo "- Linux x64: not signed; built for glibc 2.35 or newer."
            echo
            echo "On every platform the plug-in wrapper tests passed and the VST3 passed pluginval at strictness level 10; the macOS AU passed auval -strict. The CLAP and the Standalone are built and packaged but checked by neither tool, and this workflow loads the plug-ins in no DAW."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Acustra ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" -- *
