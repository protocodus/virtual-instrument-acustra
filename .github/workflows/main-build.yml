name: Main build

# Every push to main, nightly and on demand: the release workflow's validated
# packages for all three platforms, the preset demos and the editor
# screenshot, collected into one acustra-main-build-<run> artifact, beside a
# 30-minute libFuzzer run. The README demo and download blocks, the demo WAVs
# and the screenshot are then committed, but only while main still points at
# the commit that was built.
# The renders are deterministic, so an unchanged engine commits nothing.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-build
  cancel-in-progress: false

jobs:
  packages:
    name: Packages
    uses: ./.github/workflows/release.yml
    with:
      retention-days: 30
    secrets: inherit
    permissions:
      contents: write

  demos:
    name: Preset demos (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Render the preset demos
        # The shared renderer fails unless Docs/audio/midi holds one phrase
        # per preset and every demo is finite, audible, under 0 dBFS and
        # 8-12 s long (G3, G3c, G6).
        run: |
          set -euo pipefail
          cmake -S . -B build-dsp -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DACUSTRA_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
          cmake --build build-dsp --target RenderAcustraPresetDemos --parallel
          ./build-dsp/RenderAcustraPresetDemos --jobs 4 Docs/audio/midi demos

      - name: Upload the demos
        uses: actions/upload-artifact@v4
        with:
          name: demos-acustra
          path: demos/
          if-no-files-found: error
          retention-days: 30

  long-fuzz:
    name: Long libFuzzer run (fuzz tier)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build the libFuzzer harness under ASan + UBSan
        run: |
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DACUSTRA_BUILD_PLUGIN=OFF -DACUSTRA_BUILD_TOOLS=OFF \
            -DACUSTRA_ENABLE_SANITIZERS=ON -DBUILD_TESTING=ON
          cmake --build build-fuzz --parallel --target AcustraDspFuzz

      - name: Fuzz for 30 minutes
        working-directory: build-fuzz
        run: |
          mkdir -p corpus fuzz-artifacts
          ./AcustraDspFuzz -max_total_time=1800 -max_len=4096 -rss_limit_mb=4096 \
            -print_final_stats=1 -artifact_prefix=fuzz-artifacts/ corpus

      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers-acustra-${{ github.run_number }}
          path: build-fuzz/fuzz-artifacts/
          if-no-files-found: ignore

  collect:
    name: Collect and publish the main build
    needs: [packages, demos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: main-build/packages
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: demos-acustra
          path: main-build/demos

      - uses: actions/download-artifact@v4
        with:
          name: screenshot-acustra
          path: screenshot

      - name: Check the packages and write BUILD.txt and SHA256SUMS
        id: build
        working-directory: main-build
        run: |
          set -euo pipefail
          (cd packages && for sums in *-SHA256SUMS.txt; do sha256sum -c "$sums"; done)
          distribution="$(python3 - "$GITHUB_SHA" <<'EOF'
          import json, pathlib, sys
          records = [json.loads(p.read_text()) for p in sorted(pathlib.Path("packages").glob("*.manifest.json"))]
          platforms = sorted(r["platform"] for r in records)
          if platforms != ["Linux", "Windows", "macOS"]:
              sys.exit(f"error: expected one package set per platform, found {platforms}")
          versions = {r["distribution_version"] for r in records}
          if len(versions) != 1:
              sys.exit(f"error: the platforms built different identities: {versions}")
          for r in records:
              if r["source_revision"] != sys.argv[1]:
                  sys.exit(f"error: the {r['platform']} package was not built from {sys.argv[1]}")
          print(versions.pop())
          EOF
          )"
          {
            echo "Acustra ${distribution}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD.txt
          find . -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
          echo "distribution=${distribution}" >> "$GITHUB_OUTPUT"

      - name: Upload the main build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: acustra-main-build-${{ github.run_number }}
          path: main-build/
          if-no-files-found: error
          retention-days: 30

      - name: Rewrite the README blocks, demos and screenshot
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          cp screenshot/acustra.png Docs/screenshots/acustra.png
          python3 Tools/update_readme_blocks.py demos --readme README.md \
            --manifest main-build/demos/demos.json
          python3 Tools/update_readme_blocks.py download --readme README.md \
            --url "$ARTIFACT_URL" --build "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA"
          git rm -q --ignore-unmatch -- ':(glob)Docs/audio/[0-9][0-9]*-*.mp3' ':(glob)Docs/audio/[0-9][0-9]*-*.wav'
          cp main-build/demos/[0-9][0-9]*-*.wav Docs/audio/

      - name: Commit if main still points at the built commit
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::notice::main moved past ${GITHUB_SHA}; the next main build publishes instead."
            exit 0
          fi
          git add README.md Docs/screenshots/acustra.png
          git add -f -- Docs/audio/*.wav
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish main build ${{ steps.build.outputs.distribution }}"
          git push origin HEAD:main
