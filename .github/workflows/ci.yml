name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp-tests:
    name: DSP tests (Acustra, JUCE-free, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      # The Python self-tests need numpy and scipy; configure fails rather
      # than silently registering fewer tests (ACUSTRA_REQUIRE_PYTHON_TESTS).
      - name: Set up Python for the self-tests
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy and scipy
        run: python -m pip install numpy==2.5.3 scipy==1.18.1

      - name: Check distribution identities and packaging
        run: python scripts/test-distribution.py

      - name: Configure
        run: |
          cmake \
            -S "." \
            -B "build-dsp" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DACUSTRA_BUILD_PLUGIN=OFF" \
            -DBUILD_TESTING=ON \
            "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" \
            -DACUSTRA_REQUIRE_PYTHON_TESTS=ON

      - name: Build and test DSP engine
        run: |
          cmake --build "build-dsp" --parallel
          ctest --test-dir "build-dsp" -L "unit|audio" --output-on-failure

      - name: Render and verify demo audio
        run: |
          set -euo pipefail
          cmake --build "build-dsp" --target "AcustraRenderDemos" --parallel
          "./build-dsp/AcustraRenderDemos" "Docs/audio"
          # Written by hand so a demo that stops writing fails here; the
          # Acustra.DemoCount test keeps it equal to AcustraRenderDemos --list.
          rendered=$(find "Docs/audio" -maxdepth 1 -name '*.wav' | wc -l)
          if (( rendered != 10 )); then
            echo "error: rendered $rendered demo WAVs, expected 10" >&2
            exit 1
          fi
          echo "Acustra: rendered all $rendered demo WAVs"

      - name: Configure Linux plug-in build
        run: |
          cmake \
            -S "." \
            -B "build-dsp" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DACUSTRA_BUILD_PLUGIN=ON" \
            "-DACUSTRA_BUILD_CLAP=ON" \
            -DBUILD_TESTING=ON

      - name: Build Linux VST3, CLAP, standalone and plug-in tests
        run: |
          cmake --build "build-dsp" --parallel \
            --target "Acustra_VST3" "Acustra_CLAP" "Acustra_Standalone" \
              "AcustraPluginProcessorTests" "AcustraPluginTempoReleaseTests"

      - name: Run plug-in wrapper tests
        run: |
          ctest --test-dir "build-dsp" -R "^Acustra[.](PluginProcessor|PluginTempoRelease)$" --no-tests=error --output-on-failure

      - name: Package Linux VST3, CLAP and standalone
        id: linux-package
        run: |
          set -euo pipefail
          python3 scripts/package-linux.py --build-dir build-dsp
          directory="$(python3 scripts/distribution.py --build-dir build-dsp --platform Linux --arch x64 --formats VST3 CLAP Standalone)"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

          echo "distribution=$(sed -n 's/^ACUSTRA_DISTRIBUTION_VERSION:INTERNAL=//p' build-dsp/CMakeCache.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-acustra-${{ steps.linux-package.outputs.distribution }}
          path: ${{ steps.linux-package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 7

  plugin-macos:
    name: Plug-in build (Acustra, macOS universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Python self-tests need numpy and scipy; configure fails rather
      # than silently registering fewer tests (ACUSTRA_REQUIRE_PYTHON_TESTS).
      - name: Set up Python for the self-tests
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy and scipy
        run: python -m pip install numpy==2.5.3 scipy==1.18.1

      # Universal arm64 + x86_64, as the main build and releases ship. Every
      # tier runs; the render tier (Acustra.EditorScreenshot) writes and
      # checks build-macos/screenshots/acustra.png.
      - name: Build plug-in and run tests
        env:
          PYTHON: "${{ steps.python.outputs.python-path }}"
        run: ./scripts/build-macos.sh

      - name: Upload the editor screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ci-screenshot-acustra-${{ github.run_number }}
          path: build-macos/screenshots/acustra.png
          if-no-files-found: error
          retention-days: 7

      - name: Package macOS formats
        id: macos-package
        run: |
          ./scripts/sign-and-package-macos.sh
          directory="$(python3 scripts/distribution.py --build-dir build-macos --platform macOS --arch universal --formats VST3 AU CLAP Standalone)"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "distribution=$(sed -n 's/^ACUSTRA_DISTRIBUTION_VERSION:INTERNAL=//p' build-macos/CMakeCache.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ci-macos-acustra-${{ steps.macos-package.outputs.distribution }}
          path: ${{ steps.macos-package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 7

  dsp-tests-windows:
    name: DSP tests (Acustra, JUCE-free, Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Python self-tests need numpy and scipy; configure fails rather
      # than silently registering fewer tests (ACUSTRA_REQUIRE_PYTHON_TESTS).
      - name: Set up Python for the self-tests
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy and scipy
        run: python -m pip install numpy==2.5.3 scipy==1.18.1

      - name: Configure DSP tests
        run: |
          cmake -S "." -B "build-win" -A x64 "-DACUSTRA_BUILD_PLUGIN=OFF" -DBUILD_TESTING=ON "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432" "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" -DACUSTRA_REQUIRE_PYTHON_TESTS=ON

      - name: Build and test DSP engine
        run: |
          cmake --build "build-win" --config Release --parallel
          ctest --test-dir "build-win" -C Release -L "unit|audio" --output-on-failure

      - name: Configure Windows plug-in build
        run: |
          cmake -S "." -B "build-win" "-DACUSTRA_BUILD_PLUGIN=ON" "-DACUSTRA_BUILD_CLAP=ON" -DBUILD_TESTING=ON

      - name: Build Windows VST3, CLAP, standalone and plug-in tests
        run: |
          cmake --build "build-win" --config Release --parallel --target "Acustra_VST3" "Acustra_CLAP" "Acustra_Standalone" "AcustraPluginProcessorTests" "AcustraPluginTempoReleaseTests"

      - name: Run plug-in wrapper tests
        run: |
          ctest --test-dir "build-win" -C Release -R '^Acustra[.](PluginProcessor|PluginTempoRelease)$' --no-tests=error --output-on-failure

      - name: Package Windows VST3, CLAP and standalone
        id: windows-package
        shell: bash
        run: |
          python scripts/package-windows.py --build-dir build-win
          directory="$(python scripts/distribution.py --build-dir build-win --platform Windows --arch x64 --formats VST3 CLAP Standalone)"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

          echo "distribution=$(sed -n 's/^ACUSTRA_DISTRIBUTION_VERSION:INTERNAL=//p' build-win/CMakeCache.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-acustra-${{ steps.windows-package.outputs.distribution }}
          path: ${{ steps.windows-package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 7

  sanitizers:
    name: Sanitizers (Acustra, ASan + UBSan, Linux)
    runs-on: ubuntu-24.04
    # The instrumented suite takes several times the plain one.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Set up Python for the self-tests
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy and scipy
        run: python -m pip install numpy==2.5.3 scipy==1.18.1

      - name: Configure
        run: |
          cmake \
            -S "." \
            -B "build-san" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            "-DACUSTRA_BUILD_PLUGIN=OFF" \
            "-DACUSTRA_ENABLE_SANITIZERS=ON" \
            -DBUILD_TESTING=ON \
            "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" \
            -DACUSTRA_REQUIRE_PYTHON_TESTS=ON

      # The Rack Extension compiles the engine as C++17 with -Werror;
      # AcustraDSPCxx17 is that build, under Clang's -Wshadow as well.
      - name: Build the C++17 DSP check
        run: cmake --build "build-san" --target AcustraDSPCxx17 --parallel

      # The fuzz tier here is Acustra.DspFuzz, a two-minute libFuzzer run;
      # the parameter matrix needs the plug-in and has its own job below.
      - name: Build and run the unit and fuzz tiers under the sanitizers
        run: |
          cmake --build "build-san" --parallel
          ctest --test-dir "build-san" -L "unit|fuzz" --parallel 4 --output-on-failure

      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers-acustra-${{ github.run_number }}
          path: build-san/fuzz-artifacts/
          if-no-files-found: ignore

  parameter-matrix:
    name: Parameter-extremes matrix (Acustra plug-in, ASan + UBSan, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          cmake -S "." -B "build-matrix" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DACUSTRA_BUILD_PLUGIN=ON -DACUSTRA_BUILD_CLAP=OFF \
            -DACUSTRA_BUILD_TOOLS=OFF -DACUSTRA_ENABLE_SANITIZERS=ON \
            -DBUILD_TESTING=ON

      # Every parameter at its extremes, alone, in pairs and on every factory
      # preset, at 44.1/48/96 kHz and blocks of 1/64/512 (Tests/ParameterMatrix.h).
      - name: Build and run the parameter matrix
        run: |
          cmake --build "build-matrix" --parallel --target AcustraParameterMatrixTests
          ctest --test-dir "build-matrix" -R "^Acustra[.]ParameterMatrix$" --no-tests=error --output-on-failure
