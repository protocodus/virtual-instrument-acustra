name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp-tests:
    name: DSP tests (Acustra, JUCE-free, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      # The Python self-tests need numpy and scipy; configure fails rather
      # than silently registering fewer tests (ACUSTRA_REQUIRE_PYTHON_TESTS).
      - name: Set up Python for the self-tests
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy and scipy
        run: python -m pip install numpy scipy

      - name: Check distribution identities and packaging
        run: python scripts/test-distribution.py

      - name: Configure
        run: |
          cmake \
            -S "." \
            -B "build-dsp" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DACUSTRA_BUILD_PLUGIN=OFF" \
            -DBUILD_TESTING=ON \
            "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" \
            -DACUSTRA_REQUIRE_PYTHON_TESTS=ON

      - name: Build and test DSP engine
        run: |
          cmake --build "build-dsp" --parallel
          ctest --test-dir "build-dsp" --output-on-failure

      - name: Render and verify demo audio
        run: |
          set -euo pipefail
          cmake --build "build-dsp" --target "AcustraRenderDemos" --parallel
          "./build-dsp/AcustraRenderDemos" "Docs/audio"
          # Written by hand so a demo that stops writing fails here; the
          # Acustra.DemoCount test keeps it equal to AcustraRenderDemos --list.
          rendered=$(find "Docs/audio" -maxdepth 1 -name '*.wav' | wc -l)
          if (( rendered != 10 )); then
            echo "error: rendered $rendered demo WAVs, expected 10" >&2
            exit 1
          fi
          echo "Acustra: rendered all $rendered demo WAVs"

      - name: Configure Linux plug-in build
        run: |
          cmake \
            -S "." \
            -B "build-dsp" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DACUSTRA_BUILD_PLUGIN=ON" \
            -DBUILD_TESTING=OFF

      - name: Build Linux VST3 and standalone
        run: |
          cmake --build "build-dsp" --parallel \
            --target "Acustra_VST3" "Acustra_Standalone"

      - name: Package Linux VST3 and standalone
        id: linux-package
        run: |
          set -euo pipefail
          python3 scripts/package-desktop.py --build-dir build-dsp --platform Linux
          directory="$(python3 scripts/distribution.py --build-dir build-dsp --platform Linux --arch x64 --formats VST3 Standalone)"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

          echo "distribution=$(sed -n 's/^ACUSTRA_DISTRIBUTION_VERSION:INTERNAL=//p' build-dsp/CMakeCache.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-acustra-${{ steps.linux-package.outputs.distribution }}
          path: ${{ steps.linux-package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 7

  plugin-macos:
    name: Plug-in build (Acustra, macOS native arch)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Clear any committed screenshot before rendering to ensure this build produces it
      - name: Clear screenshot before rendering
        run: rm -f "Docs/screenshots/acustra-standalone.png"

      # The Python self-tests need numpy and scipy; configure fails rather
      # than silently registering fewer tests (ACUSTRA_REQUIRE_PYTHON_TESTS).
      - name: Set up Python for the self-tests
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy and scipy
        run: python -m pip install numpy scipy

      # Native-arch only keeps per-push CI fast. The local Xcode-based build
      # script defaults to universal arm64 + x86_64 output and runs the same tests.
      - name: Build plug-in and run tests
        env:
          BUILD_UNIVERSAL: "OFF"
          PYTHON: "${{ steps.python.outputs.python-path }}"
          ACUSTRA_EDITOR_SNAPSHOT: "${{ github.workspace }}/Docs/screenshots/acustra-standalone.png"
        run: ./scripts/build-macos.sh

      - name: Check that the editor screenshot was rendered
        run: |
          set -euo pipefail
          screenshot="Docs/screenshots/acustra-standalone.png"
          if [[ ! -s "$screenshot" ]]; then
            echo "error: Acustra's suite did not render $screenshot" >&2
            echo "The suite must honour ACUSTRA_EDITOR_SNAPSHOT." >&2
            exit 1
          fi
          if [[ "$(head -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]]; then
            echo "error: $screenshot does not carry the PNG signature" >&2
            exit 1
          fi
          if [[ "$(tail -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "49454e44ae426082" ]]; then
            echo "error: $screenshot has no terminating IEND chunk, so the write did not finish" >&2
            exit 1
          fi
          echo "Rendered $screenshot ($(wc -c < "$screenshot") bytes)."

      - name: Package macOS formats
        id: macos-package
        run: |
          ./scripts/sign-and-package-macos.sh
          directory="$(python3 scripts/distribution.py --build-dir build-macos --platform macOS --arch "$(uname -m)" --formats VST3 AU Standalone)"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "distribution=$(sed -n 's/^ACUSTRA_DISTRIBUTION_VERSION:INTERNAL=//p' build-macos/CMakeCache.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ci-macos-acustra-${{ steps.macos-package.outputs.distribution }}
          path: ${{ steps.macos-package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 7

  dsp-tests-windows:
    name: DSP tests (Acustra, JUCE-free, Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Python self-tests need numpy and scipy; configure fails rather
      # than silently registering fewer tests (ACUSTRA_REQUIRE_PYTHON_TESTS).
      - name: Set up Python for the self-tests
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy and scipy
        run: python -m pip install numpy scipy

      - name: Configure DSP tests
        run: |
          cmake -S "." -B "build-win" -A x64 "-DACUSTRA_BUILD_PLUGIN=OFF" -DBUILD_TESTING=ON "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432" "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" -DACUSTRA_REQUIRE_PYTHON_TESTS=ON

      - name: Build and test DSP engine
        run: |
          cmake --build "build-win" --config Release --parallel
          ctest --test-dir "build-win" -C Release --output-on-failure

      - name: Configure Windows plug-in build
        run: |
          cmake -S "." -B "build-win" "-DACUSTRA_BUILD_PLUGIN=ON" -DBUILD_TESTING=OFF

      - name: Build Windows VST3 and standalone
        run: |
          cmake --build "build-win" --config Release --parallel --target "Acustra_VST3" "Acustra_Standalone"

      - name: Package Windows VST3 and standalone
        id: windows-package
        shell: bash
        run: |
          python scripts/package-desktop.py --build-dir build-win --platform Windows
          directory="$(python scripts/distribution.py --build-dir build-win --platform Windows --arch x64)"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

          echo "distribution=$(sed -n 's/^ACUSTRA_DISTRIBUTION_VERSION:INTERNAL=//p' build-win/CMakeCache.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-acustra-${{ steps.windows-package.outputs.distribution }}
          path: ${{ steps.windows-package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 7
