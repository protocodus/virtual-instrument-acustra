name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp-tests:
    name: DSP tests (Acustra, JUCE-free, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          cmake \
            -S "." \
            -B "build-dsp" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DACUSTRA_BUILD_PLUGIN=OFF" \
            -DBUILD_TESTING=ON

      - name: Build and test DSP engine
        run: |
          cmake --build "build-dsp" --parallel
          ctest --test-dir "build-dsp" --output-on-failure

      - name: Render and verify demo audio
        run: |
          set -euo pipefail
          cmake --build "build-dsp" --target "AcustraRenderDemos" --parallel
          "./build-dsp/AcustraRenderDemos" "Docs/audio"
          rendered=$(find "Docs/audio" -maxdepth 1 -name '*.wav' | wc -l)
          if (( rendered != 12 )); then
            echo "error: rendered $rendered demo WAVs, expected 12" >&2
            exit 1
          fi
          echo "Acustra: rendered all $rendered demo WAVs"

      - name: Configure Linux plug-in build
        run: |
          cmake \
            -S "." \
            -B "build-dsp" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DACUSTRA_BUILD_PLUGIN=ON" \
            -DBUILD_TESTING=OFF

      - name: Build Linux VST3 and standalone
        run: |
          cmake --build "build-dsp" --parallel \
            --target "Acustra_VST3" "Acustra_Standalone"

      - name: Package Linux VST3 and standalone
        run: |
          set -euo pipefail
          artefacts="build-dsp/Acustra_artefacts/Release"
          test -d "$artefacts/VST3/Acustra.vst3"
          test -x "$artefacts/Standalone/Acustra"
          dist="build-dsp/dist"
          mkdir -p "$dist"
          archive="$dist/Acustra-Linux-x64.tar.gz"
          # Licence and notice files ship inside the binary archive when the
          # instrument carries them (the MIT licence requires the notice to
          # accompany binaries).
          contents=("VST3/Acustra.vst3" "Standalone/Acustra")
          for notice in LICENSE THIRD_PARTY_NOTICES.md ThirdParty/JUCE-LICENSE.md; do
            if [[ -f "$notice" ]]; then
              cp "$notice" "$artefacts/$(basename "$notice")"
              contents+=("$(basename "$notice")")
            fi
          done
          tar -czf "$archive" -C "$artefacts" "${contents[@]}"
          test -s "$archive"
          tar -tzf "$archive" >/dev/null

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-acustra
          path: build-dsp/dist/Acustra-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  plugin-macos:
    name: Plug-in build (Acustra, macOS native arch)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Clear any committed screenshot before rendering to ensure this build produces it
      - name: Clear screenshot before rendering
        run: rm -f "Docs/screenshots/acustra-standalone.png"

      # Native-arch only keeps per-push CI fast. The local Xcode-based build
      # script defaults to universal arm64 + x86_64 output and runs the same tests.
      - name: Build plug-in and run tests
        env:
          BUILD_UNIVERSAL: "OFF"
          ACUSTRA_EDITOR_SNAPSHOT: "${{ github.workspace }}/Docs/screenshots/acustra-standalone.png"
        run: ./scripts/build-macos.sh

      - name: Check that the editor screenshot was rendered
        run: |
          set -euo pipefail
          screenshot="Docs/screenshots/acustra-standalone.png"
          if [[ ! -s "$screenshot" ]]; then
            echo "error: Acustra's suite did not render $screenshot" >&2
            echo "The suite must honour ACUSTRA_EDITOR_SNAPSHOT." >&2
            exit 1
          fi
          if [[ "$(head -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]]; then
            echo "error: $screenshot does not carry the PNG signature" >&2
            exit 1
          fi
          if [[ "$(tail -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "49454e44ae426082" ]]; then
            echo "error: $screenshot has no terminating IEND chunk, so the write did not finish" >&2
            exit 1
          fi
          echo "Rendered $screenshot ($(wc -c < "$screenshot") bytes)."

  dsp-tests-windows:
    name: DSP tests (Acustra, JUCE-free, Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure DSP tests
        run: |
          cmake -S "." -B "build-win" -A x64 "-DACUSTRA_BUILD_PLUGIN=OFF" -DBUILD_TESTING=ON "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build and test DSP engine
        run: |
          cmake --build "build-win" --config Release --parallel
          ctest --test-dir "build-win" -C Release --output-on-failure

      - name: Configure Windows plug-in build
        run: |
          cmake -S "." -B "build-win" "-DACUSTRA_BUILD_PLUGIN=ON" -DBUILD_TESTING=OFF

      - name: Build Windows VST3 and standalone
        run: |
          cmake --build "build-win" --config Release --parallel --target "Acustra_VST3" "Acustra_Standalone"

      - name: Package Windows VST3 and standalone
        shell: pwsh
        run: |
          $artefacts = "build-win/Acustra_artefacts/Release"
          $vst3 = Join-Path $artefacts "VST3/Acustra.vst3"
          $standalone = Join-Path $artefacts "Standalone/Acustra.exe"
          if (-not (Test-Path -LiteralPath $vst3 -PathType Container)) {
            throw "expected VST3 bundle at $vst3"
          }
          if (-not (Test-Path -LiteralPath $standalone -PathType Leaf)) {
            throw "expected standalone executable at $standalone"
          }
          $dist = "build-win/dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $zip = Join-Path $dist "Acustra-Windows-x64.zip"
          # Licence and notice files ship inside the binary archive when the
          # instrument carries them (the MIT licence requires the notice to
          # accompany binaries).
          $contents = @((Join-Path $artefacts "VST3"), (Join-Path $artefacts "Standalone"))
          foreach ($notice in @("LICENSE", "THIRD_PARTY_NOTICES.md", "ThirdParty/JUCE-LICENSE.md")) {
            $source = Join-Path "." $notice
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              $contents += $source
            }
          }
          Compress-Archive -LiteralPath $contents -DestinationPath $zip
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf) -or
              (Get-Item -LiteralPath $zip).Length -eq 0) {
            throw "expected package at $zip"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-acustra
          path: build-win/dist/Acustra-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
